[project]
name = "renception"
version = "0.1.0"
description = "RENEE perception: RGB-D capture -> registered point cloud / mesh"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "open3d",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["renception*"]

[tool.setuptools.package-data]
renception = ["configs/*.yaml"]

[tool.pylint.typecheck]
# pyrealsense2 is a native extension whose runtime members are not visible to
# Pylint's static analyser.
ignored-modules = ["pyrealsense2"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
