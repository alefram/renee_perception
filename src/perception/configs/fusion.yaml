# Point-cloud generation pipeline parameters.
# No magic numbers in code — every tunable used by perception/*.py lives here.

odometry:
  depth_trunc: 6.0                    # ignore depth beyond this range [m]
  depth_diff_max: 0.07                # RGB-D odometry max depth difference for correspondence [m]
  loop_closure: true                  # try to register frame0<->frame_last for the pose graph
  pose_graph_max_correspondence: 0.05  # global_optimization edge acceptance distance [m]
  edge_prune_threshold: 0.25          # global_optimization: prune edges below this confidence

fusion:
  voxel: 0.008             # TSDF voxel length [m]
  sdf_trunc_factor: 5.0    # truncation distance = voxel * this
  depth_trunc: 6.0         # ignore depth beyond this range [m]
  device: "CPU:0"          # Open3D device for TSDF integration: "CPU:0" or
                            # "CUDA:0" (needs a CUDA-enabled Open3D build + GPU)
  block_count: 100000      # initial voxel-block hash-map capacity; raise for
                            # very large room-scale volumes

# Post-fusion cloud/mesh cleanup, applied after TSDF extraction (ported from
# the RENEE cleaning pipeline's cleaning/surface/meshing.py -- same filters,
# same param names). All passes are opt-in (0 / false = skip) so existing
# sessions/tests are unaffected until you turn one on.
cleanup:
  downsample_voxel: 0.0    # pre-filter voxel size [m]; 0 = skip.
                            # ~0.005-0.008 m for real RGB-D scans.
  sor_nb_neighbors: 0      # Statistical Outlier Removal: neighbours to inspect.
                            # 20-30 is a good starting point for real data. 0 = skip.
  sor_std_ratio: 2.0       # SOR threshold: drop points with mean-neighbour-dist
                            # > global_mean + std_ratio * global_std. Lower = more
                            # aggressive (1.5 for heavy noise, 2.5 for light touch).
  ror_nb_neighbors: 0      # Radius Outlier Removal: min neighbours within radius.
                            # Removes floating blobs SOR misses. 0 = skip.
  ror_radius: 0.04         # ROR search radius [m]. ~2-4x downsample_voxel works well.
  keep_largest_cluster: false  # DBSCAN: keep only the biggest connected cluster,
                            # discard disconnected background/noise blobs. false = skip.
                            # Good for an orbit scan around a single isolated object.
  cluster_eps: 0.05        # DBSCAN neighbourhood radius [m].
  cluster_min_pts: 10      # DBSCAN min points to form a cluster.
  crop_margin: 0.03        # crop the TSDF mesh to the (filtered) cloud's bbox +
                            # this margin [m], so it stays consistent with whatever
                            # the filters above removed.
  smooth_iter: 0           # Taubin mesh smoothing iterations after cleanup.
                            # 5-10 removes surface roughness without shrinking. 0 = skip.
